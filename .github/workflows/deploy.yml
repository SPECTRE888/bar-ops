      headers:{'Authorization':`Bearer ${SUPA_KEY}`,'apikey':SUPA_KEY}
    }).then(r=>r.json());
    if(error)throw error;
    if(data&&data[0]){
      state=data[0].data;
      save();
      return true;
    }
    return false;
  }catch(e){console.error('cloudPull',e);return false;}
}

