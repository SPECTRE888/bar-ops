async function checkSubscription(){
  if(!cloudUser)return false;
  try{
    const{data,error}=await fetch(`${SUPA_URL}/rest/v1/subscriptions?user_id=eq.${cloudUser.id}`,{
      headers:{'Authorization':`Bearer ${SUPA_KEY}`,'apikey':SUPA_KEY}
    }).then(r=>r.json());
    if(error||!data.length)return false;
    const sub=data[0];
    return sub.status==='active'&&new Date(sub.expires_at)>new Date();
  }catch(e){return false;}
}

async function requireSubscription(){
  const hasAccess=await checkSubscription();
  if(!hasAccess){
    document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#080808;color:#ede8e0;text-align:center;font-family:Jost,sans-serif">
      <div>
        <h1 style="font-size:32px;margin-bottom:16px">Accès bloqué</h1>
        <p style="color:#a09890;margin-bottom:24px">Souscris pour accéder à la plateforme</p>
