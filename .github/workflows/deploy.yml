async function cloudPush(){
  if(!cloudUser)return false;
  try{
    await fetch(`${SUPA_URL}/rest/v1/workspaces`,{
      method:'UPSERT',
      headers:{'Authorization':`Bearer ${SUPA_KEY}`,'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({user_id:cloudUser.id,data:state})
    });
    return true;
  }catch(e){console.error('cloudPush',e);return false;}
}

// Replace cloudRefreshSession (ligne ~700)
async function cloudRefreshSession(){
  const session=localStorage.getItem('bcp_session');
  if(!session)return false;
  try{
    const{data,error}=await fetch(`${SUPA_URL}/auth/v1/user`,{
      headers:{'Authorization':`Bearer ${session}`}
    }).then(r=>r.json());
    if(error||!data.user)return false;
    cloudUser=data.user;
    localStorage.setItem('bcp_session',session);
    return true;
  }catch(e){return false;}
}
