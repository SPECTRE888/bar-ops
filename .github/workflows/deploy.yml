javascript
// Vérifie subscription avant de lancer l'app
async function checkAccess(){
  if(!cloudUser) return window.location.href='/?login=true';
  
  const{data}=await fetch(`${SUPA_URL}/rest/v1/subscriptions?user_id=eq.${cloudUser.id}&select=*`,{
    headers:{'Authorization':`Bearer ${SUPA_KEY}`,'apikey':SUPA_KEY}
  }).then(r=>r.json());
  
  if(!data.length || data[0].status!=='active'){
    document.body.innerHTML='<div style="padding:40px;text-align:center"><h1>Accès bloqué</h1><p>Souscris pour continuer</p><a href="/">← Retour pricing</a></div>';
    return;
  }
}

// Appelle au démarrage
checkAccess();
