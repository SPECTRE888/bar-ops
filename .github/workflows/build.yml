name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.0

    - name: Setup Node.js
      uses: actions/setup-node@v4.0.2
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build:mac

    - name: Create Release
      uses: softprops/action-gh-release@v2.0.4
      with:
        files: |
          dist/*.dmg
          dist/*.dmg.blockmap
          dist/latest-mac.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
