name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build:ci -- --publish=never

    - name: Sign app (ad-hoc, no Apple certificate needed)
      run: |
        codesign --force --deep --sign - "dist/mac-arm64/Bar Ops.app" 2>/dev/null || true
        codesign --force --deep --sign - "dist/mac/Bar Ops.app" 2>/dev/null || true

    - name: Package signed app
      run: |
        cd dist/mac-arm64 && zip -r "../Bar Ops-arm64-signed.zip" "Bar Ops.app"
        cd dist/mac && zip -r "../Bar Ops-x64-signed.zip" "Bar Ops.app"

    - name: Publish Release
      run: |
        gh release create ${{ github.ref_name }} \
          "dist/Bar Ops-arm64-signed.zip" \
          "dist/Bar Ops-x64-signed.zip" \
          install.sh \
          --title "Bar Ops ${{ github.ref_name }}" \
          --notes "Installation : télécharge le ZIP pour ton Mac (arm64 = M1/M2/M3, x64 = Intel), extrais et lance Bar Ops.app"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Add install script to release
      if: startsWith(github.ref, 'refs/tags/')
      run: gh release upload ${{ github.ref_name }} install.sh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
