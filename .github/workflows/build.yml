name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build (arm64 only, zip format)
      run: npm run build:ci -- --publish=never

    - name: Sign app (ad-hoc)
      run: codesign --force --deep --sign - "dist/mac-arm64/Bar Ops.app"

    - name: Package signed app
      run: cd dist/mac-arm64 && zip -r "../Bar Ops-arm64-signed.zip" "Bar Ops.app"

    - name: Publish Release
      run: |
        gh release create ${{ github.ref_name }} \
          "dist/Bar Ops-arm64-signed.zip" \
          install.sh \
          --title "Bar Ops ${{ github.ref_name }}" \
          --notes "Télécharge le ZIP, extrais et lance Bar Ops.app — aucune manipulation requise."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
