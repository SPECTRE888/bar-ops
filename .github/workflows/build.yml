name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npx electron-builder --mac dmg --arm64 --publish=never

    - name: Find DMG
      run: ls dist/

    - name: Publish Release
      run: |
        DMG=$(find dist -name "*.dmg" | head -1)
        gh release create ${{ github.ref_name }} \
          "$DMG" \
          --title "Bar Ops ${{ github.ref_name }}" \
          --notes "## Installation\n\n1. Télécharge **Bar Ops.dmg**\n2. Ouvre le fichier DMG\n3. Glisse **Bar Ops** dans le dossier Applications\n4. Ouvre le Terminal et colle :\n\`\`\`\nxattr -cr \"/Applications/Bar Ops.app\" && open \"/Applications/Bar Ops.app\"\n\`\`\`"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
