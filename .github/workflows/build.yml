name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Clean existing release
      run: |
        TAG="${GITHUB_REF_NAME}"
        RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
        if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
          echo "Deleting release ${RELEASE_ID} for tag ${TAG}"
          gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
        else
          echo "No existing release for ${TAG}, continuing"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & Publish
      run: npx electron-builder --mac --arm64 --publish=always
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_IDENTITY_AUTO_DISCOVERY: false
