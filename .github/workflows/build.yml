name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Clean existing release
      continue-on-error: true
      run: gh release delete "$GITHUB_REF_NAME" --yes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Electron app
      run: npx electron-builder --mac --arm64 --publish=never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: List dist output
      run: ls -lh dist/ || true

    - name: Build PKG installer
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        APP_PATH="dist/mac-arm64/Bar Ops.app"

        # Signer l'app en ad-hoc avant packaging
        codesign --force --deep --sign - --timestamp=none "$APP_PATH"

        # Créer le PKG (nom sans espace)
        pkgbuild \
          --root "dist/mac-arm64" \
          --install-location "/Applications" \
          --scripts "scripts/pkg" \
          --identifier "com.barops.app" \
          --version "$VERSION" \
          "dist/BarOps-${VERSION}-Installer.pkg"

        echo "✅ PKG créé: dist/BarOps-${VERSION}-Installer.pkg"

    - name: Create release & upload assets
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        TAG="$GITHUB_REF_NAME"

        echo "=== dist/ contents ==="
        ls -lh dist/

        # Collecter uniquement les fichiers qui existent
        FILES=()
        for f in \
          "dist/BarOps-${VERSION}-Installer.pkg" \
          "dist/BarOps-${VERSION}-arm64-mac.zip" \
          "dist/BarOps-${VERSION}-arm64-mac.zip.blockmap" \
          "dist/BarOps-${VERSION}-arm64-mac.dmg" \
          "dist/BarOps-${VERSION}-arm64-mac.dmg.blockmap" \
          "dist/latest-mac.yml"
        do
          if [ -f "$f" ]; then
            FILES+=("$f")
            echo "✅ Found: $f"
          else
            echo "⚠️  Missing: $f"
          fi
        done

        gh release create "$TAG" \
          --title "$TAG" \
          --notes "Bar Ops ${TAG}" \
          "${FILES[@]}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
