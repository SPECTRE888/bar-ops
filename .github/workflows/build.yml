name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build:ci -- --publish=never

    - name: Create Installer app
      run: |
        cat > /tmp/installer.applescript << 'EOF'
        set foundApp to do shell script "find ~/Downloads -name 'Bar Ops.app' -maxdepth 4 | head -1"
        if foundApp is "" then
          display dialog "Bar Ops.app introuvable dans Téléchargements. Vérifie que tu as bien extrait BarOps.zip." buttons {"OK"} default button "OK" with icon stop
        else
          do shell script "xattr -cr " & quoted form of foundApp & " && rm -rf '/Applications/Bar Ops.app' && cp -r " & quoted form of foundApp & " '/Applications/Bar Ops.app' && xattr -cr '/Applications/Bar Ops.app'"
          do shell script "open '/Applications/Bar Ops.app'"
        end if
        EOF

        osacompile -o "dist/Installer Bar Ops.app" /tmp/installer.applescript

        # Remplacer l'icône par défaut par l'icône Bar Ops
        cp electron/assets/icon.icns "dist/Installer Bar Ops.app/Contents/Resources/applet.icns"

        codesign --force --deep --sign - "dist/Installer Bar Ops.app"

    - name: Package
      run: |
        cd dist/mac-arm64
        zip -r "../BarOps.zip" "Bar Ops.app"
        cd ..
        zip -r "Installer Bar Ops.zip" "Installer Bar Ops.app"

    - name: Publish Release
      run: |
        gh release create ${{ github.ref_name }} \
          "dist/BarOps.zip" \
          "dist/Installer Bar Ops.zip" \
          --title "Bar Ops ${{ github.ref_name }}" \
          --notes "## Installation\n\n1. Télécharge **BarOps.zip** dans Téléchargements\n2. Extrais le ZIP\n3. Ouvre Terminal et colle :\n\`\`\`\nAPP=\$(find ~/Downloads -name \"Bar Ops.app\" -maxdepth 3 | head -1) && xattr -cr \"\$APP\" && open \"\$APP\"\n\`\`\`"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
