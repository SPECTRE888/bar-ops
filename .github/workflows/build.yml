name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build (arm64 only, zip format)
      run: npm run build:ci -- --publish=never

    - name: Sign app (ad-hoc)
      run: codesign --force --deep --sign - "dist/mac-arm64/Bar Ops.app"

    - name: Package signed app with installer
      run: |
        chmod +x "Installer Bar Ops.command"
        cd dist/mac-arm64
        cp "../../Installer Bar Ops.command" .
        zip -r "../Bar Ops-arm64.zip" "Bar Ops.app" "Installer Bar Ops.command"

    - name: Publish Release
      run: |
        gh release create ${{ github.ref_name }} \
          "dist/Bar Ops-arm64.zip" \
          --title "Bar Ops ${{ github.ref_name }}" \
          --notes "1. Télécharge Bar Ops-arm64.zip\n2. Extrais le ZIP\n3. Double-clique sur 'Installer Bar Ops.command'\n4. L'app s'installe et se lance ✅"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
