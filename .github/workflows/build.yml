name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build:ci -- --publish=never

    - name: Package app
      run: |
        cd dist/mac-arm64
        zip -r "../BarOps.zip" "Bar Ops.app"

    - name: Publish Release
      run: |
        gh release create ${{ github.ref_name }} \
          "dist/BarOps.zip" \
          --title "Bar Ops ${{ github.ref_name }}" \
          --notes "## Installation\n\n1. Télécharge **BarOps.zip** dans Téléchargements\n2. Extrais le ZIP\n3. Ouvre Terminal et colle :\n\`\`\`\nAPP=\$(find ~/Downloads -name \"Bar Ops.app\" -maxdepth 3 | head -1) && xattr -cr \"\$APP\" && open \"\$APP\"\n\`\`\`"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
