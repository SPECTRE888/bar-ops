[build]
  functions = "netlify/functions"

[build.environment]
  NETLIFY_SKIP_SECURITY_CHECKS = "1"
  SECRETS_SCAN_OMIT_KEYS = "APP_URL,STRIPE_PUBLIC_KEY,SUPABASE_URL,SUPABASE_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
