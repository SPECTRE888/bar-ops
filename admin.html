<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin — BAR OPS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080808;--surface:#0f0f0f;--surface2:#141414;--border:#222;--text:#ede8e0;--text2:#a09890;--text3:#585450;--gold:#c4a46b;--gold2:#d4b47a;--gold-bg:rgba(196,164,107,.08);--red:#e05555;--green:#5ca85c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--gold);letter-spacing:.1em}
.admin-badge{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);border:1px solid var(--border);padding:3px 8px;border-radius:3px}
.btn{padding:7px 14px;border-radius:4px;font-size:10px;font-family:'Jost',sans-serif;letter-spacing:.08em;font-weight:500;cursor:pointer;border:1px solid var(--border);background:none;color:var(--text2);transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn-gold:hover{background:var(--gold2);color:#000}
.content{padding:24px 28px}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 18px}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:6px}
.stat-value{font-size:26px;font-weight:300;color:var(--text);line-height:1}
.stat-value.gold{color:var(--gold)}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-sub{font-size:10px;color:var(--text3);margin-top:4px}
.mid-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:20px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 20px}
.breakdown-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.section-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.breakdown-row:last-child{border-bottom:none}
.breakdown-plan{font-size:11px;color:var(--text2)}
.breakdown-count{font-size:14px;font-weight:500;color:var(--gold)}
.bar-bg{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:.3s}
.section-title{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:4px;font-size:10px;font-family:'Jost',sans-serif;letter-spacing:.08em;cursor:pointer;border:1px solid var(--border);background:none;color:var(--text3);transition:.15s}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
.filter-btn:hover{border-color:var(--gold);color:var(--gold)}
.search{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;font-family:'Jost',sans-serif;outline:none;width:180px}
.search:focus{border-color:var(--gold)}
.search::placeholder{color:var(--text3)}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{border-bottom:1px solid var(--border);background:var(--surface2)}
th{padding:9px 14px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-weight:500;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--gold)}
th.sorted{color:var(--gold)}
td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
td.email{color:var(--text)}
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.badge-active{background:rgba(92,168,92,.12);color:var(--green);border:1px solid rgba(92,168,92,.25)}
.badge-cancelled{background:rgba(88,84,80,.15);color:var(--text3);border:1px solid var(--border)}
.badge-past_due{background:rgba(224,85,85,.12);color:var(--red);border:1px solid rgba(224,85,85,.25)}
.badge-demo{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(196,164,107,.2)}
.copy-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 6px;font-size:10px;font-family:'Jost',sans-serif;border-radius:3px;transition:.15s}
.copy-btn:hover{color:var(--gold);background:var(--gold-bg)}
#access-denied{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px;color:var(--text3)}
#loading{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--text3);font-size:11px;letter-spacing:.1em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #3a3a3a;color:var(--text);padding:10px 18px;border-radius:5px;font-size:11px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="access-denied">
  <div style="font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold)">BAR OPS</div>
  <div style="font-size:12px">Connectez-vous d'abord à la plateforme</div>
  <a href="app.html" style="font-size:11px;color:var(--gold);margin-top:8px">→ Se connecter</a>
</div>

<div id="toast" class="toast"></div>

<div id="app" style="display:none">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="logo">BAR OPS</div>
      <div class="admin-badge">Admin</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="last-refresh" style="font-size:10px;color:var(--text3)"></span>
      <button class="btn" onclick="loadData()">Actualiser</button>
      <button class="btn btn-gold" onclick="exportCSV()">Exporter CSV</button>
      <button class="btn" onclick="window.location.href='app.html'">← Plateforme</button>
    </div>
  </div>

  <div class="content">
    <div id="loading">Chargement...</div>

    <div id="dashboard" style="display:none">

      <!-- STATS -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Abonnés actifs</div>
          <div class="stat-value green" id="s-active">—</div>
          <div class="stat-sub" id="s-new-month"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">MRR estimé</div>
          <div class="stat-value gold" id="s-mrr">—</div>
          <div class="stat-sub">par mois</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">ARR estimé</div>
          <div class="stat-value" id="s-arr">—</div>
          <div class="stat-sub">par an</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Churn rate</div>
          <div class="stat-value red" id="s-churn">—</div>
          <div class="stat-sub" id="s-cancelled-count"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">En retard</div>
          <div class="stat-value" id="s-pastdue">—</div>
          <div class="stat-sub" id="s-total"></div>
        </div>
      </div>

      <!-- CHART + BREAKDOWN -->
      <div class="mid-row">
        <div class="chart-card">
          <div class="section-label">Inscriptions — 30 derniers jours</div>
          <div id="chart-wrap"></div>
        </div>
        <div class="breakdown-card">
          <div class="section-label">Répartition par plan</div>
          <div id="breakdown"></div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="section-title" id="table-count"></div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all',this)">Tous</button>
        <button class="filter-btn" onclick="setFilter('active',this)">Actifs</button>
        <button class="filter-btn" onclick="setFilter('cancelled',this)">Annulés</button>
        <button class="filter-btn" onclick="setFilter('past_due',this)">En retard</button>
        <input class="search" id="search" type="text" placeholder="Rechercher email…" oninput="renderTable()"/>
        <span id="sort-info" style="font-size:10px;color:var(--text3);margin-left:4px"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('email')">Email <span id="sort-email"></span></th>
              <th onclick="sortBy('plan')">Plan <span id="sort-plan"></span></th>
              <th onclick="sortBy('period')">Période <span id="sort-period"></span></th>
              <th onclick="sortBy('status')">Statut <span id="sort-status"></span></th>
              <th onclick="sortBy('created_at')">Inscrit le <span id="sort-created_at"></span></th>
              <th onclick="sortBy('expires_at')">Expire le <span id="sort-expires_at"></span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script>
let sb=null, allSubs=[], currentFilter='all';
let sortState={col:'created_at',dir:-1};

fetch('/.netlify/functions/config').then(r=>r.json()).then(cfg=>{
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
  init();
});

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){document.getElementById('access-denied').style.display='flex';return;}
  window._userId=session.user.id;
  window._token=session.access_token;
  document.getElementById('app').style.display='block';
  loadData();
}

async function loadData(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('dashboard').style.display='none';
  const res=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._token}});
  if(res.status===403){document.getElementById('app').style.display='none';document.getElementById('access-denied').style.display='flex';return;}
  const{stats,subscribers}=await res.json();
  allSubs=subscribers||[];

  // Stats
  document.getElementById('s-active').textContent=stats.active;
  document.getElementById('s-mrr').textContent=stats.mrr+'€';
  document.getElementById('s-arr').textContent=Math.round(stats.mrr*12)+'€';
  const churn=stats.total>0?Math.round(stats.cancelled/stats.total*100):0;
  document.getElementById('s-churn').textContent=churn+'%';
  document.getElementById('s-cancelled-count').textContent=stats.cancelled+' annulés';
  document.getElementById('s-pastdue').textContent=stats.pastDue;
  document.getElementById('s-new-month').textContent='+'+stats.newThisMonth+' ce mois';
  document.getElementById('s-total').textContent=stats.total+' total inscrits';
  document.getElementById('last-refresh').textContent='Actualisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  renderChart();
  renderBreakdown(stats);
  renderTable();
  document.getElementById('loading').style.display='none';
  document.getElementById('dashboard').style.display='block';
}

function renderChart(){
  const now=new Date();
  const counts=[];
  const labels=[];
  for(let i=29;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const s=d.toISOString().slice(0,10);
    counts.push(allSubs.filter(x=>x.created_at?.slice(0,10)===s).length);
    labels.push(d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}));
  }
  const max=Math.max(...counts,1);
  const W=600,H=80,n=30,barW=(W/n)*0.55,gap=W/n;
  const bars=counts.map((c,i)=>{
    const h=Math.max((c/max)*H,c>0?2:0);
    const x=i*gap+gap*0.225;
    return `<rect x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${c>0?'#c4a46b':'#1c1c1c'}" rx="1"/>
    <title>${labels[i]}: ${c} inscription${c>1?'s':''}</title>`;
  }).join('');
  const axisLabels=[0,9,19,29].map(i=>`<text x="${(i*gap+gap/2).toFixed(1)}" y="${H+13}" text-anchor="middle" font-size="7.5" fill="#585450">${labels[i]}</text>`).join('');
  document.getElementById('chart-wrap').innerHTML=`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;display:block">${bars}${axisLabels}</svg>`;
}

function renderBreakdown(stats){
  const now=new Date();
  const active=allSubs.filter(s=>s.status==='active'&&new Date(s.expires_at)>now);
  const plans=['early','pro','business'];
  const planLabel={early:'Accès Anticipé',pro:'Pro',business:'Business'};
  const counts=plans.map(p=>({plan:p,label:planLabel[p],count:active.filter(s=>s.plan===p).length}));
  const maxCount=Math.max(...counts.map(c=>c.count),1);
  document.getElementById('breakdown').innerHTML=counts.map(c=>`
    <div class="breakdown-row">
      <div>
        <div class="breakdown-plan">${c.label}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(c.count/maxCount*100)}%"></div></div>
      </div>
      <div class="breakdown-count">${c.count}</div>
    </div>
  `).join('');
}

function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function sortBy(col){
  if(sortState.col===col)sortState.dir*=-1;
  else{sortState.col=col;sortState.dir=-1;}
  ['email','plan','period','status','created_at','expires_at'].forEach(c=>{
    const el=document.getElementById('sort-'+c);
    if(el)el.textContent=c===sortState.col?(sortState.dir===1?'↑':'↓'):'';
  });
  document.querySelectorAll('th').forEach(th=>th.classList.remove('sorted'));
  renderTable();
}

function renderTable(){
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  const now=new Date();
  let rows=allSubs.filter(s=>{
    if(currentFilter!=='all'&&s.status!==currentFilter)return false;
    if(q&&!s.email.toLowerCase().includes(q))return false;
    return true;
  });
  rows.sort((a,b)=>{
    let va=a[sortState.col]||'',vb=b[sortState.col]||'';
    return va<vb?-sortState.dir:va>vb?sortState.dir:0;
  });
  const fmt=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
  const planLabel=p=>p?p.charAt(0).toUpperCase()+p.slice(1):'—';
  const periodLabel=p=>p==='yearly'?'Annuel':p==='monthly'?'Mensuel':'—';
  document.getElementById('table-count').textContent=rows.length+' abonné'+(rows.length>1?'s':'');
  document.getElementById('tbody').innerHTML=rows.map(s=>`
    <tr>
      <td class="email">${s.email}</td>
      <td>${planLabel(s.plan)}</td>
      <td>${periodLabel(s.period)}</td>
      <td><span class="badge badge-${s.status||'demo'}">${s.status||'demo'}</span></td>
      <td>${fmt(s.created_at)}</td>
      <td style="color:${s.expires_at&&new Date(s.expires_at)<now?'var(--red)':'var(--text2)'}">${fmt(s.expires_at)}</td>
      <td><button class="copy-btn" onclick="copyEmail('${s.email}')">Copier</button></td>
    </tr>
  `).join('')||'<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text3)">Aucun résultat</td></tr>';
}

function copyEmail(email){
  navigator.clipboard.writeText(email).then(()=>showToast('Email copié'));
}

function exportCSV(){
  const headers=['Email','Plan','Période','Statut','Inscrit le','Expire le'];
  const fmt=d=>d?new Date(d).toLocaleDateString('fr-FR'):'';
  const rows=allSubs.map(s=>[s.email,s.plan||'',s.period||'',s.status||'',fmt(s.created_at),fmt(s.expires_at)]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);
  a.download='bar-ops-abonnes-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  showToast('Export CSV téléchargé');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
