<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Connexion — BAR OPS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080808;--surface:#0f0f0f;--text:#ede8e0;--text2:#a09890;--gold:#c4a46b;--gold2:#d4b47a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:#000;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--surface);border:1px solid #2a2a2a;border-radius:12px;padding:60px 48px;max-width:450px;width:100%;text-align:center}
h1{font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:300;margin-bottom:18px;letter-spacing:.1em;color:var(--gold)}
.sub{color:var(--text2);font-size:12px;margin-bottom:40px;letter-spacing:.08em;text-transform:uppercase}
.msg{padding:12px;border-radius:5px;margin-bottom:20px;font-size:12px;display:none}
.msg.ok{background:rgba(106,170,136,.2);color:#6aaa88;display:block}
.msg.err{background:rgba(220,100,100,.2);color:#dc6464;display:block}
.btn{width:100%;padding:14px;border:1px solid #2a2a2a;background:none;color:var(--text);border-radius:5px;cursor:pointer;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;transition:.2s;margin-bottom:12px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.fill{background:var(--gold);color:#080808;border-color:var(--gold);margin-top:16px}
.btn.fill:hover{background:var(--gold2)}
.btn.fill:disabled{opacity:.5}
.toggle{font-size:12px;color:var(--text2);margin-top:20px}
.toggle button{background:none;border:none;color:var(--gold);cursor:pointer;text-decoration:underline;font-family:'Jost',sans-serif}
.back{margin-top:24px;display:flex;justify-content:center;gap:32px;align-items:center}
.back a{color:var(--text2);text-decoration:none;font-size:12px;transition:.2s}
.back a:hover{color:var(--gold)}
.footer-links{display:contents}
</style>
</head>
<body>
<div class="box">
  <h1>BAR OPS</h1>
  <p class="sub" id="sub">Connectez-vous</p>
  <div class="msg" id="msg"></div>

  <div id="view-login">
    <button class="btn fill" onclick="googleAuthLogin()">Se connecter avec Google</button>
    <div class="toggle">Pas de compte ? <button onclick="show('signup')">S'inscrire</button></div>
  </div>

  <div id="view-signup" style="display:none">
    <button class="btn fill" onclick="googleAuthSignup()">S'inscrire avec Google</button>
    <div class="toggle">Déjà inscrit ? <button onclick="show('login')">Se connecter</button></div>
  </div>

  <div class="back">
    <a href="index.html">← Retour</a>
    <a href="app.html?demo=1" style="font-size:11px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px">Visualiser sans se connecter →</a>
  </div>
</div>

<script>
let sb=null;
fetch('/.netlify/functions/config')
  .then(r=>r.json())
  .then(cfg=>{
    if(window.supabase) sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{detectSessionInUrl:true,persistSession:true}});
  })
  .catch(e=>console.error('Config error:',e));

function show(v){
  document.getElementById('view-signup').style.display=v==='signup'?'block':'none';
  document.getElementById('view-login').style.display=v==='login'?'block':'none';
  document.getElementById('sub').textContent=v==='signup'?'Créez votre compte':'Connectez-vous';
  document.getElementById('msg').className='msg';
}

function msg(t,type){
  const el=document.getElementById('msg');
  el.textContent=t;
  el.className='msg '+(type==='ok'?'ok':'err');
}

async function waitForSb(){
  let i=0;
  while(!sb&&i<50){await new Promise(r=>setTimeout(r,100));i++;}
  return sb;
}

async function googleAuthLogin(){
  const s=await waitForSb();if(!s)return msg('Erreur de configuration','err');
  await s.auth.signOut();
  const{error}=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://bar-opsv2public.netlify.app/auth.html?action=login',queryParams:{prompt:'select_account'}}});
  if(error)msg(error.message,'err');
}

async function googleAuthSignup(){
  const s=await waitForSb();if(!s)return msg('Erreur de configuration','err');
  await s.auth.signOut();
  const{error}=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://bar-opsv2public.netlify.app/auth.html?action=signup',queryParams:{prompt:'select_account'}}});
  if(error)msg(error.message,'err');
}

async function redirect(session){
  const userId=session.user.id;
  const token=session.access_token;

  // 1. Check for pending invite-accept flow
  const params=new URLSearchParams(window.location.search);
  const inviteToken=params.get('token');
  if(params.get('action')==='accept-invite'&&inviteToken){
    msg('Acceptation de l\'invitation…','ok');
    try{
      const r=await fetch('/.netlify/functions/accept-invite',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({token:inviteToken})
      });
      const d=await r.json();
      if(!r.ok){msg(d.error||'Erreur','err');return;}
      // Store role/permissions for the app to pick up
      try{localStorage.setItem('barops_profile',JSON.stringify(d.profile));}catch(e){}
      window.location.href='app.html';
    }catch(e){msg(e.message,'err');}
    return;
  }

  // 2. Load profile (role + permissions) and cache it
  try{
    const{data:profile}=await sb.from('profiles')
      .select('id,role,permissions,status,company_id,companies(name,plan,max_agents)')
      .eq('id',userId).single();
    if(profile){
      try{localStorage.setItem('barops_profile',JSON.stringify(profile));}catch(e){}
      // Suspended agents are blocked
      if(profile.status==='suspended'){
        msg('Votre accès a été suspendu. Contactez votre administrateur.','err');
        await sb.auth.signOut();
        return;
      }
    }
  }catch(e){console.warn('Profile load:',e.message);}

  // 3. Check subscription
  try{
    const{data}=await sb.from('subscriptions').select('status,expires_at').eq('user_id',userId).single();
    if(data&&new Date(data.expires_at)>new Date()){
      // Honour ?next= param for deep-link redirects
      const next=new URLSearchParams(window.location.search).get('next');
      window.location.href=next||'app.html';
      return;
    }
  }catch(e){}
  window.location.href='paying.html';
}

// Redirect after Google OAuth callback
(async()=>{
  const params=new URLSearchParams(window.location.search);
  const action=params.get('action');
  if(!action)return;

  await waitForSb();

  // PKCE: session may already be established by the time JS runs
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    await redirect(session);
    return;
  }

  // Fallback: listen for sign-in event
  sb.auth.onAuthStateChange(async(e,s)=>{
    if(e==='SIGNED_IN'&&s) await redirect(s);
  });
})();
</script>
</body>
</html>
