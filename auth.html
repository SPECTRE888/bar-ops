<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Connexion — BAR OPS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080808;--surface:#0f0f0f;--text:#ede8e0;--text2:#a09890;--gold:#c4a46b;--gold2:#d4b47a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;background:#000;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--surface);border:1px solid #222;border-radius:8px;padding:56px 48px 48px;max-width:440px;width:100%;text-align:center}
h1{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;margin-bottom:10px;letter-spacing:.14em;color:var(--gold);line-height:1}
.sub{color:var(--text2);font-size:10px;margin-bottom:44px;letter-spacing:.18em;text-transform:uppercase;font-family:'Jost',sans-serif;font-weight:400}
.msg{padding:10px 12px;border-radius:3px;margin-bottom:20px;font-size:11px;letter-spacing:.04em;display:none}
.msg.ok{background:rgba(106,170,136,.15);color:#6aaa88;border:1px solid rgba(106,170,136,.3);display:block}
.msg.err{background:rgba(220,100,100,.12);color:#dc6464;border:1px solid rgba(220,100,100,.25);display:block}
.btn{width:100%;padding:13px 16px;border:1px solid #2a2a2a;background:none;color:var(--text2);border-radius:3px;cursor:pointer;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;transition:.2s;margin-bottom:10px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.fill{background:var(--gold);color:#080808;border-color:var(--gold);font-weight:600;letter-spacing:.14em;margin-top:4px}
.btn.fill:hover{background:var(--gold2);border-color:var(--gold2)}
.btn.fill:disabled{opacity:.4}
.toggle{font-size:11px;color:var(--text2);margin-top:18px;letter-spacing:.03em}
.toggle button{background:none;border:none;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:'Jost',sans-serif;font-size:11px}
.back{margin-top:28px;display:flex;justify-content:center;gap:32px;align-items:center;border-top:1px solid #1e1e1e;padding-top:20px}
.back a{color:var(--text2);text-decoration:none;font-size:10px;letter-spacing:.08em;transition:.2s}
.back a:hover{color:var(--gold)}
.footer-links{display:contents}
</style>
</head>
<body>
<div class="box">
  <h1>BAR OPS</h1>
  <p class="sub" id="sub">Connectez-vous</p>
  <div class="msg" id="msg"></div>

  <div id="view-login">
    <button class="btn fill" onclick="googleAuthLogin()">Se connecter avec Google</button>
    <div class="toggle">Pas de compte ? <button onclick="show('signup')">S'inscrire</button></div>
  </div>

  <div id="view-signup" style="display:none">
    <button class="btn fill" onclick="googleAuthSignup()">S'inscrire avec Google</button>
    <div class="toggle">Déjà inscrit ? <button onclick="show('login')">Se connecter</button></div>
  </div>

  <div class="back">
    <a href="index.html">← Retour</a>
    <a href="app.html?demo=1" style="font-size:11px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px">Visualiser sans se connecter →</a>
  </div>
</div>

<script>
const API_BASE="https://bar-ops-v2.vercel.app";
let sb=null;
fetch(API_BASE+'/api/config')
  .then(r=>r.json())
  .then(cfg=>{
    if(window.supabase) sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{detectSessionInUrl:true,persistSession:true}});
  })
  .catch(e=>console.error('Config error:',e));

function show(v){
  document.getElementById('view-signup').style.display=v==='signup'?'block':'none';
  document.getElementById('view-login').style.display=v==='login'?'block':'none';
  document.getElementById('sub').textContent=v==='signup'?'Créez votre compte':'Connectez-vous';
  document.getElementById('msg').className='msg';
}

function msg(t,type){
  const el=document.getElementById('msg');
  el.textContent=t;
  el.className='msg '+(type==='ok'?'ok':'err');
}

async function waitForSb(){
  let i=0;
  while(!sb&&i<50){await new Promise(r=>setTimeout(r,100));i++;}
  return sb;
}

async function googleAuthLogin(){
  const s=await waitForSb();if(!s)return msg('Erreur de configuration','err');
  await s.auth.signOut();
  const{error}=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://bar-ops-v2.vercel.app/auth.html?action=login',queryParams:{prompt:'select_account'}}});
  if(error)msg(error.message,'err');
}

async function googleAuthSignup(){
  const s=await waitForSb();if(!s)return msg('Erreur de configuration','err');
  await s.auth.signOut();
  const{error}=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://bar-ops-v2.vercel.app/auth.html?action=signup',queryParams:{prompt:'select_account'}}});
  if(error)msg(error.message,'err');
}

async function redirect(userId){
  // Charger le profil pour connaître le rôle et le company owner
  let profile=null;
  try{
    const{data,error}=await sb.from('profiles')
      .select('id,role,permissions,status,company_id,companies(owner_id,name,plan,max_agents)')
      .eq('id',userId).maybeSingle();
    console.log('[auth] profile:', data, 'error:', error);
    profile=data;
    if(profile) try{localStorage.setItem('barops_profile',JSON.stringify(profile));}catch(e){}
    if(profile?.status==='suspended'){
      msg('Votre accès a été suspendu. Contactez votre administrateur.','err');
      await sb.auth.signOut(); return;
    }
  }catch(e){console.error('[auth] profile fetch error:', e);}

  // Les agents passent directement — app.html vérifie l'abo de l'owner via check-access (service key)
  if(profile?.role==='AGENT'){
    window.location.href='app.html';
    return;
  }

  try{
    const{data,error}=await sb.from('subscriptions').select('status,expires_at').eq('user_id',userId).maybeSingle();
    if(error){window.location.href='app.html';return;}
    if(data&&new Date(data.expires_at)>new Date()){window.location.href='app.html';return;}
  }catch(e){
    window.location.href='app.html';
    return;
  }
  window.location.href='paying.html';
}

// Flow acceptation d'invitation
async function handleInvite(session){
  const token=session.access_token;
  const inviteToken=new URLSearchParams(window.location.search).get('token');
  msg('Acceptation de l\'invitation…','ok');
  try{
    const r=await fetch(API_BASE+'/api/agents',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({token:inviteToken})
    });
    const d=await r.json();
    if(!r.ok){msg(d.error||'Erreur','err');return;}
    try{localStorage.setItem('barops_profile',JSON.stringify(d.profile));}catch(e){}
    window.location.href='app.html';
  }catch(e){msg(e.message,'err');}
}

// Redirect after Google OAuth callback
(async()=>{
  const params=new URLSearchParams(window.location.search);
  const action=params.get('action');
  if(!action)return;

  await waitForSb();

  const{data:{session}}=await sb.auth.getSession();

  // Pour une invitation : si on revient du OAuth (session fraîche), traiter l'invite
  // Sinon, forcer la sélection du bon compte Google
  if(action==='accept-invite'){
    const invToken=new URLSearchParams(window.location.search).get('token');
    const justLoggedIn=sessionStorage.getItem('invite_oauth_done');
    if(justLoggedIn){
      // Retour OAuth — attendre la session (le fragment peut ne pas être encore parsé)
      sessionStorage.removeItem('invite_oauth_done');
      if(session){
        await handleInvite(session);
      } else {
        sb.auth.onAuthStateChange(async(e,s)=>{
          if(e==='SIGNED_IN'&&s) await handleInvite(s);
        });
      }
      return;
    }
    // Premier passage — déconnecter et forcer sélection compte Google
    if(session) await sb.auth.signOut();
    sessionStorage.setItem('invite_oauth_done','1');
    msg('Connectez-vous avec le compte Gmail invité…','ok');
    await sb.auth.signInWithOAuth({provider:'google',options:{
      redirectTo:'https://bar-ops-v2.vercel.app/auth.html?action=accept-invite&token='+invToken,
      queryParams:{prompt:'select_account'}
    }});
    return;
  }

  if(session){
    await redirect(session.user.id);
    return;
  }
  sb.auth.onAuthStateChange(async(e,s)=>{
    if(e==='SIGNED_IN'&&s) await redirect(s.user.id);
  });
})();
</script>
</body>
</html>
