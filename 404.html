<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page introuvable — BAR OPS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Jost:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:#080808;color:#ede8e0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-family:'Cormorant Garamond',serif;font-size:80px;font-weight:300;color:#c4a46b;line-height:1;margin-bottom:16px}
p{font-size:13px;color:#7a7268;margin-bottom:40px;letter-spacing:.04em}
a{display:inline-block;padding:12px 40px;background:#c4a46b;color:#080808;text-decoration:none;border-radius:3px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;transition:.2s}
a:hover{background:#d4b47a}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>Cette page n'existe pas.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
