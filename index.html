<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BAR OPS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.stripe.com/v3/"></script>
<script>
let SUPA_URL='', SUPA_KEY='';
let sb=null;
fetch('/.netlify/functions/config')
  .then(r=>r.json())
  .then(cfg=>{
    SUPA_URL=cfg.supabaseUrl;
    SUPA_KEY=cfg.supabaseKey;
    if(window.supabase) sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  })
  .catch(e=>console.error('Erreur chargement config:',e));
</script>
<style>
:root{--bg:#080808;--text:#ede8e0;--text2:#7a7268;--gold:#c4a46b;--gold2:#d4b47a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Jost',sans-serif;background:#000;color:var(--text);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:0}
h1,h2,h3{font-family:'Cormorant Garamond',serif}

/* HERO */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;gap:0}
.logo{font-size:54px;font-weight:300;letter-spacing:.1em;margin-bottom:18px;color:var(--gold)}
.tagline{font-size:20px;font-weight:300;color:var(--text);letter-spacing:.02em;margin-bottom:44px;max-width:600px}
.btn-primary{padding:14px 52px;background:var(--gold);color:#080808;border:none;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.16em;text-transform:uppercase;font-family:'Jost',sans-serif;transition:.25s;margin-bottom:0}
.btn-primary:hover{background:var(--gold2)}

/* FOOTER */
footer{width:100%;border-top:none;padding:0}
.legal{text-align:center;font-size:12px;color:var(--text2);padding:12px 24px;border-top:none;line-height:1.6;opacity:1}
.legal-link{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.legal-link:hover{color:var(--gold)}
#legal-modal{display:none}
#legal-modal.open{display:flex!important}
</style>
</head>
<body>

<div class="hero">
  <div class="logo">BAR OPS</div>
  <div class="tagline">Une nouvelle manière de piloter vos événements.</div>
  <button class="btn-primary" onclick="window.location.href='auth.html'">Accéder à la plateforme</button>
</div>

<footer>
  <div class="legal">
    © 2026 BAR OPS by Intelligence Spotlighted — <span class="legal-link" onclick="showLegal('cgv')">CGV</span> — <span class="legal-link" onclick="showLegal('rgpd')">Confidentialité</span> — <span class="legal-link" onclick="showLegal('mentions')">Mentions</span>
  </div>
</footer>

<div id="legal-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#0a0a0a;border:1px solid #c4a46b;border-radius:6px;padding:36px 40px;max-width:580px;width:92%;position:relative;color:#ede8e0;font-size:13px;line-height:1.8">
    <button onclick="document.getElementById('legal-modal').style.display='none'" style="position:absolute;top:14px;right:18px;background:none;border:none;color:#c4a46b;font-size:22px;cursor:pointer;line-height:1">×</button>
    <div id="legal-content" style="white-space:pre-line"></div>
  </div>
</div>

<script>
(async()=>{
  let retries=0;
  while(!sb&&retries<30){
    await new Promise(r=>setTimeout(r,100));
    retries++;
  }
  if(!sb||!window.supabase)return;
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return;
  try{
    const{data}=await sb.from('subscriptions').select('status,expires_at').eq('user_id',session.user.id).eq('status','active').order('expires_at',{ascending:false}).limit(1).then(r=>({data:r.data?.[0]}));
    if(data?.status==='active'&&new Date(data.expires_at)>new Date())window.location.href='app.html';
  }catch(e){}
})();
</script>

  rgpd:`Politique de confidentialité — Conformément au RGPD (Règlement UE 2016/679), vous disposez d\'un droit d\'accès, de rectification et de suppression de vos données. Aucune donnée personnelle n\'est cédée à des tiers. Données hébergées par Netlify Inc. (USA) dans le cadre du Privacy Shield. Responsable de traitement : Intelligence Spotlighted, 63 avenue Pasteur, 93100 Montreuil. Contact : contact@intelligencespotlighted.com`,
  mentions:`Mentions légales — Éditeur : Intelligence Spotlighted\n63 avenue Pasteur, 93100 Montreuil, France\nEmail : contact@intelligencespotlighted.com\nDirecteur de publication : Jérôme\nHébergement : Netlify Inc., 44 Montgomery Street, San Francisco, CA 94104, USA`
};
function showLegal(type){
  document.getElementById('legal-content').textContent=LEGAL[type];
  const m=document.getElementById('legal-modal');
  m.style.display='flex';
  m.style.alignItems='center';
  m.style.justifyContent='center';
}
</script>
</body>
</html>
