<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bar Ops — Gestion des collaborateurs</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── DARK (défaut) ── */
:root{
  --bg:#080808;--surface:#0f0f0f;--surface2:#161616;--border:#222;--border2:#2e2e2e;
  --text:#ede8e0;--text2:#a09890;--text3:#6a6460;
  --gold:#c4a46b;--gold2:#d4b47a;--gold-bg:rgba(196,164,107,.08);--gold-border:rgba(196,164,107,.22);
  --danger:#c0392b;--danger-bg:rgba(192,57,43,.12);--danger-border:rgba(192,57,43,.3);
  --font-display:'Cormorant Garamond',serif;--font-body:'Jost',sans-serif;
}
/* ── LIGHT ── */
[data-theme="light"]{
  --bg:#f5f3ef;--surface:#ffffff;--surface2:#f0ede8;--border:#ddd9d2;--border2:#ccc8c0;
  --text:#1a1814;--text2:#6b6560;--text3:#a09890;
  --gold:#9a7a3a;--gold2:#b08840;--gold-bg:rgba(154,122,58,.08);--gold-border:rgba(154,122,58,.22);
  --danger:#b84444;--danger-bg:rgba(184,68,68,.08);--danger-border:rgba(184,68,68,.25);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-weight:300;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text);min-height:100vh}

/* NAV */
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px}
nav .logo{font-family:var(--font-body);font-weight:500;font-size:14px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
nav .links{display:flex;gap:20px;align-items:center}
nav a{color:var(--text2);text-decoration:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;transition:color .15s}
nav a:hover,nav a.active{color:var(--gold)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-bg);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--gold);cursor:pointer}

/* LAYOUT */
.page{max-width:960px;margin:0 auto;padding:32px 20px}
h1{font-family:var(--font-display);font-size:28px;font-weight:300;margin-bottom:4px;color:var(--text);letter-spacing:.06em}
.subtitle{color:var(--text2);font-size:11px;margin-bottom:28px;letter-spacing:.06em;text-transform:uppercase}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px 24px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;letter-spacing:.04em}
.badge-admin{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.badge-agent{background:var(--gold-bg);color:var(--text2);border:1px solid var(--border2)}
.badge-pending{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);opacity:.7}
.badge-suspended{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}

/* INVITE FORM */
.invite-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.invite-form label{font-size:10px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:5px;color:var(--text3)}
.invite-form input,.invite-form select{
  padding:8px 10px;border:1px solid var(--border2);border-radius:3px;font-size:12px;
  background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s;font-family:var(--font-body);font-weight:300
}
.invite-form input:focus,.invite-form select:focus{border-color:var(--gold)}
.invite-form select option{background:var(--surface2)}
.invite-form .field{display:flex;flex-direction:column}
.invite-form .field.grow{flex:1;min-width:200px}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:3px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:none;color:var(--text2);transition:all .15s;font-family:var(--font-body)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn-primary{background:var(--gold);color:#080808;border-color:var(--gold);font-weight:600}
.btn-primary:hover{background:var(--gold2);border-color:var(--gold2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.btn-danger:hover{opacity:.8}
.btn-sm{padding:5px 10px;font-size:9px}

/* SEAT BANNER */
.seat-banner{background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:6px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}

/* AGENT LIST */
.agent-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.agent-row:last-child{border-bottom:none}
.agent-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold-bg);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px;color:var(--gold);flex-shrink:0}
.agent-info{flex:1;min-width:0}
.agent-email{font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.agent-meta{font-size:10px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:.04em}
.agent-actions{display:flex;gap:6px;flex-shrink:0}

/* PERMISSIONS GRID */
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.preset-btn.active{background:var(--gold);color:#080808;border-color:var(--gold)}
.perm-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:11px}
.perm-label{color:var(--text2)}
.toggle{position:relative;display:inline-block;width:36px;height:20px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border2);border-radius:20px;transition:.2s;cursor:pointer}
.slider:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:var(--text3);border-radius:50%;transition:.2s}
input:checked + .slider{background:var(--gold)}
input:checked + .slider:before{transform:translateX(16px);background:#080808}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:16px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:4px;font-size:11px;letter-spacing:.04em;z-index:200;opacity:0;transform:translateY(6px);transition:.25s;max-width:300px}
.toast.show{opacity:1;transform:none}
.toast.error{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger)}

/* STATS */
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 18px;flex:1;min-width:110px}
.stat-val{font-family:var(--font-display);font-size:28px;font-weight:300;color:var(--gold);line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}

/* EMPTY */
.empty{text-align:center;padding:28px;color:var(--text3);font-size:11px;letter-spacing:.06em}

/* AUDIT */
.audit-row{font-size:11px;padding:7px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.audit-row:last-child{border-bottom:none}
.audit-time{color:var(--text3);white-space:nowrap;min-width:120px;letter-spacing:.03em}
.audit-action{color:var(--text2)}

@media(max-width:600px){
  .invite-form{flex-direction:column}
  .invite-form .field.grow{min-width:0}
  .stats{gap:8px}
}
</style>
<script>
(function(){
  const t=localStorage.getItem('bcp_theme')||'auto';
  let resolved=t;
  if(t==='auto') resolved=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  if(resolved==='light') document.documentElement.setAttribute('data-theme','light');
})();
</script>
</head>
<body>

<nav>
  <span class="logo">Bar Ops</span>
  <div class="links">
    <a href="/app.html">← Application</a>
    <a href="/company-admin.html" class="active">Collaborateurs</a>
    <div class="avatar" id="navAvatar">?</div>
  </div>
</nav>

<div class="page">
  <h1>Gestion des collaborateurs</h1>
  <p class="subtitle" id="companySubtitle">Chargement…</p>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statAgents">–</div><div class="stat-lbl">Agents actifs</div></div>
    <div class="stat"><div class="stat-val" id="statMax">–</div><div class="stat-lbl">Membres max (plan actuel)</div></div>
    <div class="stat"><div class="stat-val" id="statPending">–</div><div class="stat-lbl">Invitations en attente</div></div>
  </div>

  <!-- INVITE FORM -->
  <div class="card">
    <div class="card-title">Inviter un collaborateur</div>
    <div class="invite-form">
      <div class="field grow">
        <label>Email <span style="font-weight:400;color:var(--text-muted)">(adresse Gmail uniquement)</span></label>
        <input type="email" id="invEmail" placeholder="collaborateur@gmail.com">
      </div>
      <div class="field">
        <label>Rôle</label>
        <select id="invRole">
          <option value="AGENT">Agent</option>
          <option value="COMPANY_ADMIN">Administrateur</option>
        </select>
      </div>
      <div class="field">
        <button class="btn btn-primary" id="btnInvite" onclick="sendInvite()">Envoyer l'invitation</button>
      </div>
    </div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="font-size:12px;color:var(--text-muted)" id="seatInfo">–</div>
      <button class="btn btn-ghost" id="btnAddSeat" onclick="addSeat()" style="font-size:11px;white-space:nowrap">+ Ajouter un siège — 29€/mois</button>
    </div>
    <div style="margin-top:14px">
      <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:8px">Profil de permissions</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <button class="btn btn-ghost btn-sm preset-btn active" id="preset-commercial" onclick="applyPreset('commercial')">Commercial</button>
        <button class="btn btn-ghost btn-sm preset-btn" id="preset-barman" onclick="applyPreset('barman')">Barman / Carte</button>
        <button class="btn btn-ghost btn-sm preset-btn" id="preset-custom" onclick="applyPreset('custom')">Personnalisé</button>
      </div>
      <div id="presetDesc" style="font-size:12px;color:var(--text-muted);margin-bottom:10px"></div>
      <div id="invitePermissions">
        <div class="perm-grid" id="invitePermGrid"></div>
      </div>
    </div>
  </div>

  <!-- AGENTS LIST -->
  <div class="card">
    <div class="card-title">Collaborateurs <span id="agentCount" class="badge badge-agent">0</span></div>
    <div id="agentList"><div class="empty">Chargement…</div></div>
  </div>

  <!-- INVITATIONS EN ATTENTE -->
  <div class="card" id="pendingCard" style="display:none">
    <div class="card-title">Invitations en attente</div>
    <div id="invList"></div>
  </div>

  <!-- AUDIT LOG -->
  <div class="card">
    <div class="card-title">Journal d'activité</div>
    <div id="auditList"><div class="empty">Chargement…</div></div>
  </div>
</div>

<!-- MODAL PERMISSIONS -->
<div class="overlay" id="permModal" style="display:none" onclick="if(event.target===this)closePermModal()">
  <div class="modal">
    <div class="modal-title">Modifier les permissions</div>
    <div id="permModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePermModal()">Annuler</button>
      <button class="btn btn-primary" onclick="savePermissions()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ─────────────────────────────────────────────────
let _supabase, _session, _profile, _currentTargetId;

const PERM_LABELS = {
  canViewRevenue:     'Voir le CA total',
  canViewAnalytics:   'Voir les analyses globales',
  canViewEventMargin: 'Voir la marge par événement',
  canViewCosts:       'Voir les coûts internes',
  canManageClients:   'Gérer les clients',
  canCreateEvents:    'Créer des événements',
  canEditProjects:    'Modifier les événements',
  canManageCatalogue: 'Gérer le catalogue (produits/cocktails)',
  canManageStaff:     'Gérer les collaborateurs',
  canManageSuppliers: 'Gérer les fournisseurs',
  canExportData:      'Exporter les données',
};

// Profils prédéfinis
const ROLE_PRESETS = {
  commercial: {
    label: 'Commercial',
    desc: 'Gère clients et événements, voit les marges par event/cocktail. Pas d\'accès au CA total.',
    perms: {
      canViewRevenue:     false,
      canViewAnalytics:   false,
      canViewEventMargin: true,
      canViewCosts:       false,
      canManageClients:   true,
      canCreateEvents:    true,
      canEditProjects:    true,
      canManageCatalogue: false,
      canManageStaff:     false,
      canManageSuppliers: false,
      canExportData:      false,
    }
  },
  barman: {
    label: 'Barman / Carte',
    desc: 'Gère le catalogue (produits & cocktails). Ne crée pas d\'événements et ne voit pas les finances.',
    perms: {
      canViewRevenue:     false,
      canViewAnalytics:   false,
      canViewEventMargin: false,
      canViewCosts:       false,
      canManageClients:   false,
      canCreateEvents:    false,
      canEditProjects:    false,
      canManageCatalogue: true,
      canManageStaff:     false,
      canManageSuppliers: true,
      canExportData:      false,
    }
  },
  custom: {
    label: 'Personnalisé',
    desc: 'Définissez manuellement les permissions.',
    perms: {
      canViewRevenue:     false,
      canViewAnalytics:   false,
      canViewEventMargin: false,
      canViewCosts:       false,
      canManageClients:   false,
      canCreateEvents:    false,
      canEditProjects:    false,
      canManageCatalogue: false,
      canManageStaff:     false,
      canManageSuppliers: false,
      canExportData:      false,
    }
  },
};

const DEFAULT_AGENT_PERMS = ROLE_PRESETS.commercial.perms;

// ─── BOOT ────────────────────────────────────────────────────
async function boot() {
  // Load Supabase client from config endpoint
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  _supabase = createClient(cfg.supabaseUrl, cfg.supabaseKey || cfg.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = '/auth.html'; return; }
  _session = session;

  // Load profile
  const { data: profile } = await _supabase
    .from('profiles')
    .select('*, companies(name, plan, max_agents)')
    .eq('id', session.user.id)
    .single();

  _profile = profile;

  if (!profile || !['COMPANY_ADMIN', 'SUPER_ADMIN'].includes(profile.role)) {
    document.querySelector('.page').innerHTML = '<div style="padding:48px;text-align:center;color:#dc2626">Accès réservé aux administrateurs.</div>';
    return;
  }

  // UI init
  document.getElementById('navAvatar').textContent = (session.user.email || '?')[0].toUpperCase();

  const planLabel = {'solo':'Early Access','pro':'Pro','business':'Business'}[profile.companies?.plan] || (profile.companies?.plan || 'Standard');
  document.getElementById('companySubtitle').textContent =
    `${profile.companies?.name || 'Votre entreprise'} — ${planLabel}`;

  buildInvitePermGrid();
  await loadData();
}

// ─── DATA ────────────────────────────────────────────────────
async function loadData() {
  const token = _session.access_token;
  const res = await apiFetch('manage-agent', { action: 'list' }, token);
  if (!res.ok) { toast('Erreur lors du chargement', true); return; }
  const { agents, invitations } = res.data;

  renderStats(agents, invitations);
  renderAgents(agents);
  renderInvitations(invitations);
  loadAuditLog();
}

function renderStats(agents, invitations) {
  const active = (agents || []).filter(a => a.status === 'active').length;
  const maxAgents = _profile.companies?.max_agents ?? 2;
  document.getElementById('statAgents').textContent = active;
  document.getElementById('statMax').textContent = maxAgents;
  document.getElementById('statPending').textContent = (invitations || []).length;
  document.getElementById('agentCount').textContent = (agents || []).length;
  const seatInfo = document.getElementById('seatInfo');
  if (seatInfo) seatInfo.textContent = `${active} / ${maxAgents} siège${maxAgents > 1 ? 's' : ''} utilisé${active > 1 ? 's' : ''}`;
}

async function addSeat(opts = {}) {
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = 'Chargement…'; }
  try {
    const body = { action: 'add-seat', quantity: 1 };
    if (opts.pendingEmail) body.pendingEmail = opts.pendingEmail;
    if (opts.pendingRole) body.pendingRole = opts.pendingRole;
    if (opts.pendingPermissions) body.pendingPermissions = opts.pendingPermissions;
    const r = await fetch('/api/billing', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_session.access_token}` },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Erreur', true); if (btn) { btn.disabled = false; btn.textContent = '+ 1 siège — 29€/mois'; } return; }
    window.location.href = d.url;
  } catch(e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = '+ 1 siège — 29€/mois'; } }
}

function detectPreset(perms) {
  if (!perms || !Object.keys(perms).length) return { key: 'custom', label: 'Personnalisé' };
  for (const [key, preset] of Object.entries(ROLE_PRESETS)) {
    if (key === 'custom') continue;
    const match = Object.entries(preset.perms).every(([k, v]) => !!perms[k] === v);
    if (match) return { key, label: preset.label };
  }
  return { key: 'custom', label: 'Personnalisé' };
}

const PRESET_COLORS = {
  commercial: 'background:rgba(196,164,107,.15);color:#c4a46b;border:1px solid #4a3820',
  barman:     'background:rgba(100,180,120,.1);color:#7ab88a;border:1px solid #1a3a20',
  custom:     'background:rgba(255,255,255,.05);color:#7a7060;border:1px solid #2a2520',
};

function renderAgents(agents) {
  const el = document.getElementById('agentList');
  if (!agents?.length) { el.innerHTML = '<div class="empty">Aucun collaborateur pour l\'instant.</div>'; return; }

  el.innerHTML = agents.map(a => {
    const preset = a.role === 'AGENT' ? detectPreset(a.permissions) : null;
    const presetBadge = preset
      ? `<span style="font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;${PRESET_COLORS[preset.key]||PRESET_COLORS.custom}">${preset.label}</span>`
      : '';
    return `
    <div class="agent-row">
      <div class="agent-avatar">${(a.email||'?')[0].toUpperCase()}</div>
      <div class="agent-info">
        <div class="agent-email">${a.email || a.id}</div>
        <div class="agent-meta">
          <span class="badge badge-${a.role === 'COMPANY_ADMIN' ? 'admin' : 'agent'}">${a.role === 'COMPANY_ADMIN' ? 'Admin' : 'Agent'}</span>
          ${presetBadge}
          ${a.status === 'suspended' ? '<span class="badge badge-suspended" style="margin-left:4px">Suspendu</span>' : ''}
        </div>
      </div>
      <div class="agent-actions">
        <button class="btn btn-ghost btn-sm" onclick="openPermModal('${a.id}',${JSON.stringify(a.permissions).replace(/"/g,'&quot;')})">Permissions</button>
        ${a.status === 'suspended'
          ? `<button class="btn btn-ghost btn-sm" onclick="agentAction('reactivate','${a.id}')">Réactiver</button>`
          : `<button class="btn btn-ghost btn-sm" onclick="agentAction('suspend','${a.id}')">Suspendre</button>`}
        <button class="btn btn-danger btn-sm" onclick="agentAction('remove','${a.id}')">Retirer</button>
      </div>
    </div>
  `;
  }).join('');
}

function renderInvitations(invitations) {
  const card = document.getElementById('pendingCard');
  if (!invitations?.length) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  document.getElementById('invList').innerHTML = invitations.map(inv => `
    <div class="agent-row">
      <div class="agent-avatar" style="background:#1a1408;color:#c4a46b">@</div>
      <div class="agent-info">
        <div class="agent-email">${inv.email}</div>
        <div class="agent-meta">
          <span class="badge badge-pending">En attente</span>
          <span class="badge badge-${inv.role === 'COMPANY_ADMIN' ? 'admin' : 'agent'}" style="margin-left:4px">${inv.role === 'COMPANY_ADMIN' ? 'Admin' : 'Agent'}</span>
          &nbsp;· expire ${new Date(inv.expires_at).toLocaleDateString('fr-FR')}
        </div>
      </div>
      <div class="agent-actions">
        <button class="btn btn-ghost btn-sm" onclick="invAction('resend_invite','${inv.id}')">Renvoyer</button>
        <button class="btn btn-danger btn-sm" onclick="invAction('cancel_invite','${inv.id}')">Annuler</button>
      </div>
    </div>
  `).join('');
}

async function loadAuditLog() {
  const { data: logs } = await _supabase
    .from('audit_logs')
    .select('*')
    .eq('company_id', _profile.company_id)
    .order('created_at', { ascending: false })
    .limit(20);

  const el = document.getElementById('auditList');
  if (!logs?.length) { el.innerHTML = '<div class="empty">Aucune activité enregistrée.</div>'; return; }

  const ACTION_LABELS = {
    invite_sent:       'Invitation envoyée',
    invite_cancelled:  'Invitation annulée',
    invite_accepted:   'Invitation acceptée',
    permission_updated:'Permissions modifiées',
    role_updated:      'Rôle modifié',
    agent_suspended:   'Agent suspendu',
    agent_reactivated: 'Agent réactivé',
    agent_removed:     'Agent retiré',
  };

  el.innerHTML = logs.map(l => `
    <div class="audit-row">
      <span class="audit-time">${new Date(l.created_at).toLocaleString('fr-FR')}</span>
      <span class="audit-action">${ACTION_LABELS[l.action] || l.action}
        ${l.metadata?.email ? `— <em>${l.metadata.email}</em>` : ''}
      </span>
    </div>
  `).join('');
}

// ─── INVITE ──────────────────────────────────────────────────
let _currentPreset = 'commercial';

function applyPreset(preset) {
  _currentPreset = preset;
  const p = ROLE_PRESETS[preset];
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('preset-' + preset);
  if (btn) btn.classList.add('active');
  document.getElementById('presetDesc').textContent = p.desc;
  // Mettre à jour les toggles
  Object.entries(p.perms).forEach(([k, v]) => {
    const el = document.getElementById('invPerm_' + k);
    if (el) el.checked = v;
    const row = el?.closest('.perm-item');
    if (row) row.style.opacity = preset === 'custom' ? '1' : (v ? '1' : '0.5');
  });
  // En mode custom, activer les toggles ; sinon, les désactiver (lecture seule)
  document.querySelectorAll('#invitePermGrid input[type=checkbox]').forEach(cb => {
    cb.disabled = preset !== 'custom';
  });
}

function buildInvitePermGrid() {
  const perms = ROLE_PRESETS.commercial.perms;
  document.getElementById('invitePermGrid').innerHTML = Object.entries(PERM_LABELS).map(([k, label]) => `
    <div class="perm-item">
      <span class="perm-label">${label}</span>
      <label class="toggle">
        <input type="checkbox" id="invPerm_${k}" ${perms[k] ? 'checked' : ''} disabled>
        <span class="slider"></span>
      </label>
    </div>
  `).join('');
  // Appliquer le preset par défaut
  setTimeout(() => applyPreset('commercial'), 0);
}

async function sendInvite() {
  const email = document.getElementById('invEmail').value.trim();
  const role = document.getElementById('invRole').value;
  if (!email) { toast('Veuillez saisir un email', true); return; }

  // Utiliser le preset actif (ou les valeurs custom si mode custom)
  const permissions = _currentPreset !== 'custom'
    ? { ...ROLE_PRESETS[_currentPreset].perms }
    : Object.fromEntries(Object.keys(PERM_LABELS).map(k => {
        const el = document.getElementById('invPerm_' + k);
        return [k, el ? el.checked : false];
      }));

  const btn = document.getElementById('btnInvite');
  btn.disabled = true; btn.textContent = 'Envoi…';

  // Récupérer fromEmail et sendgridApiKey depuis le state local de l'app
  let fromEmail = '', fromName = '', sendgridApiKey = '';
  try {
    const uid = _session.user.id;
    const sk  = `barcraft_v3_${uid}`;
    const appState = JSON.parse(localStorage.getItem(sk) || 'null');
    fromEmail     = appState?.profile?.senderEmail || '';
    fromName      = appState?.profile?.barName || '';
    sendgridApiKey= appState?.profile?.sendgridApiKey || '';
    console.log('[invite] fromEmail:', fromEmail, '| sgKey:', sendgridApiKey ? 'OK' : 'MISSING');
  } catch(e) { console.error('[invite] localStorage error:', e); }

  const res = await apiFetch('invite-agent', { email, role, permissions, fromEmail, fromName, sendgridApiKey }, _session.access_token);
  btn.disabled = false; btn.textContent = 'Envoyer l\'invitation';

  if (!res.ok) {
    const errMsg = res.data?.error || 'Erreur';
    // Si limite atteinte → proposer achat de siège avec email pré-rempli
    if (errMsg.toLowerCase().includes('limit') || errMsg.toLowerCase().includes('siège') || errMsg.toLowerCase().includes('max')) {
      if (confirm(`Limite de collaborateurs atteinte.\n\nAjouter un siège supplémentaire pour ${email} ? (29€/mois)\nL'invitation sera envoyée automatiquement après paiement.`)) {
        await addSeat({ pendingEmail: email, pendingRole: role, pendingPermissions: permissions });
      }
    } else {
      toast(errMsg, true);
    }
    btn.disabled = false; btn.textContent = 'Envoyer l\'invitation';
    return;
  }

  document.getElementById('invEmail').value = '';
  if (res.data.emailSent) {
    toast('Invitation envoyée à ' + email);
  } else {
    toast('Invitation créée mais email non envoyé : ' + (res.data.emailError || 'erreur inconnue') + '. Copiez le lien manuellement.', true);
    prompt('Lien d\'invitation à copier :', res.data.inviteUrl);
  }
  loadData();
}

// ─── AGENT ACTIONS ───────────────────────────────────────────
async function agentAction(action, targetUserId) {
  const labels = { suspend: 'suspendre', remove: 'retirer', reactivate: 'réactiver' };
  if (!confirm(`Voulez-vous vraiment ${labels[action] || action} cet agent ?`)) return;
  const res = await apiFetch('manage-agent', { action, targetUserId }, _session.access_token);
  if (!res.ok) { toast(res.data.error || 'Erreur', true); return; }
  toast('Action effectuée');
  loadData();
}

async function invAction(action, invitationId) {
  const res = await apiFetch('manage-agent', { action, invitationId }, _session.access_token);
  if (!res.ok) { toast(res.data.error || 'Erreur', true); return; }
  toast('Invitation mise à jour');
  loadData();
}

// ─── PERMISSIONS MODAL ──────────────────────────────────────
function openPermModal(userId, currentPerms) {
  _currentTargetId = userId;
  const perms = { ...ROLE_PRESETS.custom.perms, ...currentPerms };

  document.getElementById('permModalBody').innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      ${Object.entries(ROLE_PRESETS).map(([key, p]) =>
        `<button class="btn btn-ghost btn-sm" onclick="applyModalPreset('${key}')">${p.label}</button>`
      ).join('')}
    </div>
    <div class="perm-grid">` +
    Object.entries(PERM_LABELS).map(([k, label]) => `
      <div class="perm-item">
        <span class="perm-label">${label}</span>
        <label class="toggle">
          <input type="checkbox" id="modPerm_${k}" ${perms[k] ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </div>
    `).join('') + '</div>';

  document.getElementById('permModal').style.display = 'flex';
}

function applyModalPreset(preset) {
  const p = ROLE_PRESETS[preset];
  if (!p) return;
  Object.entries(p.perms).forEach(([k, v]) => {
    const el = document.getElementById('modPerm_' + k);
    if (el) el.checked = v;
  });
}

function closePermModal() {
  document.getElementById('permModal').style.display = 'none';
  _currentTargetId = null;
}

async function savePermissions() {
  const permissions = {};
  Object.keys(PERM_LABELS).forEach(k => {
    const el = document.getElementById('modPerm_' + k);
    if (el) permissions[k] = el.checked;
  });
  const res = await apiFetch('manage-agent',
    { action: 'update_permissions', targetUserId: _currentTargetId, permissions },
    _session.access_token
  );
  if (!res.ok) { toast(res.data.error || 'Erreur', true); return; }
  closePermModal();
  toast('Permissions enregistrées');
  loadData();
}

// ─── HELPERS ─────────────────────────────────────────────────
async function apiFetch(fn, body, token) {
  // map old netlify function names → Vercel /api/agents route
  const endpoint = (fn === 'invite-agent' || fn === 'manage-agent') ? '/api/agents' : `/api/${fn}`;
  // inject type for agents route
  if (fn === 'invite-agent') body = { ...body, type: 'invite' };
  if (fn === 'manage-agent') body = { ...body, type: 'manage' };
  try {
    const r = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    return { ok: r.ok, data };
  } catch (e) {
    return { ok: false, data: { error: e.message } };
  }
}

let _toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
}

boot().then(() => {
  const p = new URLSearchParams(window.location.search);
  if (p.get('seat') === 'success') toast('Siège ajouté ! Vous pouvez maintenant inviter un collaborateur supplémentaire.');
  if (p.get('seat') === 'cancelled') toast('Ajout de siège annulé.', true);
  if (p.get('seat')) history.replaceState({}, '', '/company-admin.html');
});
